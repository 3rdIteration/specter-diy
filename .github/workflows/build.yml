name: Build

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow from'
        required: false
        default: 'master'
      source_branch:
        description: 'Branch of source code to build (defaults to the workflow branch if not set)'
        required: false
        default: ''

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.source_branch || github.event.inputs.branch || github.ref }}
          submodules: recursive
      
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Cache Nix store
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/nix
            /nix/store
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-${{ runner.os }}-

      - name: Build Unix simulator
        run: nix develop -c make unix

      - name: Build STM32F469 Discovery firmware
        run: nix develop -c make disco

      - name: Build release binaries (ST-Link + drag-and-drop)
        id: release-binaries
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: nix develop -c make release-binaries

      - name: Upload development firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: |
            bin/specter-diy.hex
            bin/specter-diy.bin

      - name: Upload initial-flash binary (bootloader + firmware, for DIS_F469NI or st-flash)
        if: steps.release-binaries.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: initial-flash-binary
          path: release/initial_firmware.bin

      - name: Upload SD-card upgrade binary (Specter bootloader upgrade via SD card)
        if: steps.release-binaries.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sd-card-upgrade-binary
          path: release/specter_upgrade.bin
