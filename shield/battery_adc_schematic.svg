<text x="590" y="307" text-anchor="start" font-size="12" font-family="sans-serif" font-weight="bold" fill="black">Design Notes</text>
<text x="590" y="325" text-anchor="start" font-size="9" font-family="monospace" font-weight="normal" fill="#333">· Q1 isolates divider when device is OFF</text>
<text x="590" y="339" text-anchor="start" font-size="9" font-family="monospace" font-weight="normal" fill="#333">  (PWR_HOLD LOW → Q2 OFF → Q1 gate = VBAT → OFF)</text>
<text x="590" y="353" text-anchor="start" font-size="9" font-family="monospace" font-weight="normal" fill="#333">· Q2 level-shifts 3.3 V PWR_HOLD to drive Q1</text>
<text x="590" y="367" text-anchor="start" font-size="9" font-family="monospace" font-weight="normal" fill="#333">· Divider: 150k/(100k+150k) = 0.60</text>
<text x="590" y="381" text-anchor="start" font-size="9" font-family="monospace" font-weight="normal" fill="#333">  4.2 V × 0.60 = 2.52 V (safe for 3.3 V ADC)</text>
<text x="590" y="395" text-anchor="start" font-size="9" font-family="monospace" font-weight="normal" fill="#333">· Zero standby drain when device is powered off</text>
<text x="590" y="409" text-anchor="start" font-size="9" font-family="monospace" font-weight="normal" fill="#333"></text>
<text x="590" y="423" text-anchor="start" font-size="9" font-family="monospace" font-weight="normal" fill="#333">· TP4056 CHRG: open-drain, LOW = charging</text>
<text x="590" y="437" text-anchor="start" font-size="9" font-family="monospace" font-weight="normal" fill="#333">· MCU internal pull-up or R5 reads HIGH-Z as HIGH</text>
<text x="590" y="451" text-anchor="start" font-size="9" font-family="monospace" font-weight="normal" fill="#333"></text>
<text x="590" y="465" text-anchor="start" font-size="9" font-family="monospace" font-weight="normal" fill="#333">Voltage = (ADC / 4095) × 3.3 / 0.60</text>
</svg>