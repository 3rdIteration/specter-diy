<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520"
     font-family="monospace, Courier New, Courier" font-size="12">

  <!-- Background -->
  <rect width="900" height="520" fill="#FFFFF8" stroke="#999" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">
    External Crystal Oscillator Connection for ST8034ATDT
  </text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#666">
    Replacing MCU USART2_CK clock with a 4 MHz crystal on XTAL1/XTAL2
  </text>

  <!-- ===== CURRENT DESIGN (Top Half) ===== -->
  <text x="30" y="80" font-size="14" font-weight="bold" fill="#B00">Current Design (MCU Clock)</text>
  <line x1="30" y1="85" x2="870" y2="85" stroke="#B00" stroke-width="0.5" stroke-dasharray="4,2"/>

  <!-- MCU Box -->
  <rect x="50" y="110" width="180" height="120" rx="5" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
  <text x="140" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">STM32F469</text>
  <text x="140" y="152" text-anchor="middle" font-size="10" fill="#555">USART2</text>

  <!-- MCU Pins -->
  <text x="232" y="178" font-size="10" fill="#333" text-anchor="end">PA4 (USART2_CK)</text>
  <circle cx="235" cy="175" r="3" fill="#4285F4"/>
  <text x="232" y="208" font-size="10" fill="#333" text-anchor="end">PA2 (USART2_TX)</text>
  <circle cx="235" cy="205" r="3" fill="#4285F4"/>

  <!-- SC_CLK wire (current) -->
  <line x1="238" y1="175" x2="440" y2="175" stroke="#E53935" stroke-width="2"/>
  <text x="340" y="168" text-anchor="middle" font-size="10" fill="#E53935" font-weight="bold">SC_CLK (~4.5 MHz)</text>

  <!-- SC_IO wire -->
  <line x1="238" y1="205" x2="440" y2="205" stroke="#1B5E20" stroke-width="1.5"/>
  <text x="340" y="220" text-anchor="middle" font-size="10" fill="#1B5E20">SC_IO</text>

  <!-- ST8034 Box (current) -->
  <rect x="440" y="110" width="180" height="120" rx="5" fill="#FFF3E0" stroke="#FB8C00" stroke-width="2"/>
  <text x="530" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">U401</text>
  <text x="530" y="152" text-anchor="middle" font-size="10" fill="#555">ST8034ATDT</text>

  <!-- ST8034 Pins (current) -->
  <text x="443" y="178" font-size="10" fill="#333">Pin 1: XTAL1</text>
  <circle cx="437" cy="175" r="3" fill="#FB8C00"/>
  <text x="443" y="208" font-size="10" fill="#333">Pin 16: I/O_µC</text>
  <circle cx="437" cy="205" r="3" fill="#FB8C00"/>

  <!-- XTAL2 to GND (current) -->
  <text x="443" y="228" font-size="9" fill="#888">Pin 2: XTAL2 → NC</text>

  <!-- Card connector (current) -->
  <rect x="700" y="130" width="120" height="80" rx="5" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.5"/>
  <text x="760" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">J401</text>
  <text x="760" y="175" text-anchor="middle" font-size="9" fill="#555">Smartcard</text>
  <text x="760" y="190" text-anchor="middle" font-size="9" fill="#555">Connector</text>
  <line x1="620" y1="165" x2="700" y2="165" stroke="#8E24AA" stroke-width="1.5"/>
  <text x="660" y="160" text-anchor="middle" font-size="9" fill="#8E24AA">CLK, IO, etc.</text>


  <!-- ===== PROPOSED DESIGN (Bottom Half) ===== -->
  <text x="30" y="280" font-size="14" font-weight="bold" fill="#1B5E20">Proposed Design (External 4 MHz Crystal)</text>
  <line x1="30" y1="285" x2="870" y2="285" stroke="#1B5E20" stroke-width="0.5" stroke-dasharray="4,2"/>

  <!-- MCU Box (proposed) -->
  <rect x="50" y="310" width="180" height="120" rx="5" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
  <text x="140" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">STM32F469</text>
  <text x="140" y="352" text-anchor="middle" font-size="10" fill="#555">USART2</text>

  <!-- MCU Pins (proposed) -->
  <text x="232" y="378" font-size="10" fill="#999" text-anchor="end">PA4 (CK unused)</text>
  <circle cx="235" cy="375" r="3" fill="#CCC"/>
  <text x="232" y="408" font-size="10" fill="#333" text-anchor="end">PA2 (USART2_TX)</text>
  <circle cx="235" cy="405" r="3" fill="#4285F4"/>

  <!-- SC_CLK wire REMOVED - shown as dashed/struck -->
  <line x1="238" y1="375" x2="310" y2="375" stroke="#CCC" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="280" y="368" text-anchor="middle" font-size="9" fill="#E53935">DISCONNECTED</text>
  <!-- X mark -->
  <line x1="295" y1="365" x2="325" y2="385" stroke="#E53935" stroke-width="2.5"/>
  <line x1="325" y1="365" x2="295" y2="385" stroke="#E53935" stroke-width="2.5"/>

  <!-- SC_IO wire (still connected) -->
  <line x1="238" y1="405" x2="440" y2="405" stroke="#1B5E20" stroke-width="1.5"/>
  <text x="340" y="420" text-anchor="middle" font-size="10" fill="#1B5E20">SC_IO (unchanged)</text>

  <!-- ST8034 Box (proposed) -->
  <rect x="440" y="310" width="180" height="120" rx="5" fill="#FFF3E0" stroke="#FB8C00" stroke-width="2"/>
  <text x="530" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">U401</text>
  <text x="530" y="352" text-anchor="middle" font-size="10" fill="#555">ST8034ATDT</text>

  <!-- ST8034 Pins (proposed) -->
  <text x="443" y="378" font-size="10" fill="#333">Pin 1: XTAL1</text>
  <circle cx="437" cy="375" r="3" fill="#FB8C00"/>
  <text x="443" y="408" font-size="10" fill="#333">Pin 16: I/O_µC</text>
  <circle cx="437" cy="405" r="3" fill="#FB8C00"/>
  <text x="443" y="428" font-size="10" fill="#333">Pin 2: XTAL2</text>
  <circle cx="437" cy="425" r="3" fill="#FB8C00"/>

  <!-- Crystal symbol between XTAL1 and XTAL2 -->
  <!-- Wires from ST8034 XTAL1/XTAL2 going left -->
  <line x1="437" y1="375" x2="360" y2="375" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="437" y1="425" x2="360" y2="425" stroke="#2E7D32" stroke-width="1.5"/>

  <!-- Crystal body -->
  <rect x="340" y="385" width="40" height="30" rx="2" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <!-- Crystal internal lines -->
  <line x1="350" y1="390" x2="370" y2="390" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="350" y1="410" x2="370" y2="410" stroke="#2E7D32" stroke-width="1.5"/>
  <!-- Crystal plates -->
  <line x1="345" y1="385" x2="345" y2="415" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="375" y1="385" x2="375" y2="415" stroke="#2E7D32" stroke-width="1.5"/>
  <!-- Crystal leads -->
  <line x1="360" y1="375" x2="360" y2="385" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="360" y1="415" x2="360" y2="425" stroke="#2E7D32" stroke-width="1.5"/>

  <!-- Crystal label -->
  <text x="360" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">Y401</text>
  <text x="360" y="463" text-anchor="middle" font-size="10" fill="#2E7D32">4 MHz</text>
  <text x="360" y="475" text-anchor="middle" font-size="9" fill="#666">SMD3225-4P</text>

  <!-- Load capacitors -->
  <!-- C_L1 on XTAL1 side -->
  <line x1="390" y1="375" x2="390" y2="385" stroke="#2E7D32" stroke-width="1"/>
  <!-- Capacitor plates -->
  <line x1="384" y1="385" x2="396" y2="385" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="384" y1="389" x2="396" y2="389" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="390" y1="389" x2="390" y2="395" stroke="#2E7D32" stroke-width="1"/>
  <!-- GND symbol -->
  <line x1="385" y1="395" x2="395" y2="395" stroke="#333" stroke-width="1.5"/>
  <line x1="387" y1="398" x2="393" y2="398" stroke="#333" stroke-width="1"/>
  <line x1="389" y1="401" x2="391" y2="401" stroke="#333" stroke-width="0.7"/>
  <text x="403" y="394" font-size="8" fill="#666">C_L1</text>

  <!-- C_L2 on XTAL2 side -->
  <line x1="390" y1="425" x2="390" y2="415" stroke="#2E7D32" stroke-width="1"/>
  <!-- Capacitor plates -->
  <line x1="384" y1="415" x2="396" y2="415" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="384" y1="411" x2="396" y2="411" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="390" y1="411" x2="390" y2="405" stroke="#2E7D32" stroke-width="1"/>
  <!-- GND symbol -->
  <line x1="385" y1="405" x2="395" y2="405" stroke="#333" stroke-width="1.5"/>
  <line x1="387" y1="402" x2="393" y2="402" stroke="#333" stroke-width="1"/>
  <line x1="389" y1="399" x2="391" y2="399" stroke="#333" stroke-width="0.7"/>
  <text x="403" y="420" font-size="8" fill="#666">C_L2</text>

  <!-- Card connector (proposed) -->
  <rect x="700" y="330" width="120" height="80" rx="5" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.5"/>
  <text x="760" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">J401</text>
  <text x="760" y="375" text-anchor="middle" font-size="9" fill="#555">Smartcard</text>
  <text x="760" y="390" text-anchor="middle" font-size="9" fill="#555">Connector</text>
  <line x1="620" y1="365" x2="700" y2="365" stroke="#8E24AA" stroke-width="1.5"/>
  <text x="660" y="360" text-anchor="middle" font-size="9" fill="#8E24AA">CLK, IO, etc.</text>

  <!-- Notes box -->
  <rect x="640" y="430" width="240" height="75" rx="4" fill="#FFFDE7" stroke="#F9A825" stroke-width="1"/>
  <text x="650" y="447" font-size="9" font-weight="bold" fill="#333">Notes:</text>
  <text x="650" y="460" font-size="8.5" fill="#555">• Crystal: 4 MHz, SMD3225-4P</text>
  <text x="650" y="473" font-size="8.5" fill="#555">• C_L1, C_L2: Per crystal datasheet</text>
  <text x="650" y="486" font-size="8.5" fill="#555">• CLKDIV1=LOW → divider=1 → 4 MHz to card</text>
  <text x="650" y="499" font-size="8.5" fill="#555">• SC_CLK from MCU: disconnected</text>

</svg>
